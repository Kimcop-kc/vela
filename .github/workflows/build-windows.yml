name: Build Windows Vela
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout empty workspace
        uses: actions/checkout@v4

      - name: Clone original vela repo into subfolder
        run: git clone https://github.com/heider-x/vela.git vela-src

      - name: Switch working directory
        working-directory: ./vela-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: ./vela-src
        run: pnpm install

      - name: Build Windows exe
        working-directory: ./vela-src
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Windows-Exe
          path: vela-src/dist/*.exe
