name: Build Windows Vela
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    env:
      # node-gyp环境变量，指定编译器版本
      GYP_MSVS_VERSION: 2022
      PYTHON: python3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm via npm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Windows-Build
          path: dist/*.exe
