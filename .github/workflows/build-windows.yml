name: Build Windows Vela
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout empty workspace
        uses: actions/checkout@v4

      - name: Clone original vela repo into subfolder
        run: git clone https://github.com/heider-x/vela.git vela-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18  # 使用 Node.js 18.x LTS

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8  # 使用 pnpm 8.x

      - name: 配置 npm 镜像源
        run: npm config set registry https://registry.npmmirror.com

      - name: Install dependencies
        working-directory: ./vela-src
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows exe
        working-directory: ./vela-src
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Windows-Exe
          path: vela-src/dist/*.exe
          retention-days: 30
