name: Build Vela (Windows + macOS)

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
    # 只改文档 / 说明文件时不重新打包
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: vela-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  quality:
    name: Typecheck, tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 检出本仓库代码
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装质量检查依赖
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --ignore-scripts
          else
            npm install --legacy-peer-deps --ignore-scripts
          fi
          npm rebuild better-sqlite3

      - name: 校验标签版本
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED="v$VERSION"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 与 package.json 版本 $EXPECTED 不一致"
            exit 1
          fi

      - name: 类型检查、单元测试和代码检查
        shell: bash
        run: npm run ci:quality

  build:
    name: ${{ matrix.label }}
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            label: Windows x64
            artifact: Vela-Windows-x64
            build_args: "-- --win --x64 --publish never"
            files: |
              release/**/*.exe
              !release/**/win-unpacked/**
          - os: macos-15-intel      # Intel 机器，直接在 x64 上编，避免交叉编译原生依赖
            label: macOS x64 (Intel)
            artifact: Vela-macOS-x64
            build_args: "-- --mac --x64 --publish never"
            files: |
              release/**/*.dmg
          - os: macos-15            # Apple Silicon 机器，编 arm64
            label: macOS arm64 (Apple Silicon)
            artifact: Vela-macOS-arm64
            build_args: "-- --mac --arm64 --publish never"
            files: |
              release/**/*.dmg

    steps:
      - name: 检出本仓库代码
        uses: actions/checkout@v4

      - name: 显示将要构建的提交
        shell: bash
        run: git log -1 --format="%H %s"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 使用 npm 安装依赖
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: 构建 ${{ matrix.label }}
        shell: bash
        run: npm run build ${{ matrix.build_args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # 强制 electron-builder 的 dmg-builder 等二进制从官方 GitHub 下载（npmmirror 缺新版会 404）
          ELECTRON_BUILDER_BINARIES_MIRROR: https://github.com/electron-userland/electron-builder-binaries/releases/download/

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30

      - name: 显示构建结果
        shell: bash
        run: |
          echo "=== release 目录内容 ==="
          find release -type f \( -name '*.exe' -o -name '*.dmg' \) -exec ls -lh {} \; || true

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ quality, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出本仓库代码
        uses: actions/checkout@v4

      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 生成发布说明
        shell: bash
        run: node scripts/extract-release-notes.mjs "$GITHUB_REF_NAME" release-notes.md

      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          FILES=$(find release-assets -type f \( -name '*.exe' -o -name '*.dmg' \) | sort)

          if [ -z "$FILES" ]; then
            echo "::error::未找到可发布的安装包"
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新发布说明和安装包资产"
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vela $TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Vela $TAG" \
              --notes-file release-notes.md
          fi

          while IFS= read -r file; do
            echo "上传 $file -> $TAG"
            gh release upload "$TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"
          done <<< "$FILES"
