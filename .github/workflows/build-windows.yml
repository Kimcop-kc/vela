name: Build Windows Vela (Node.js 22)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout empty workspace
        uses: actions/checkout@v4

      - name: Clone original vela repo into subfolder
        run: git clone https://github.com/heider-x/vela.git vela-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  # 使用 Node.js 22.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: 配置 npm 镜像源
        run: npm config set registry https://registry.npmmirror.com

      - name: 配置 pnpm 环境
        run: |
          pnpm config set store-dir "~/.pnpm-store"
          mkdir -p "$HOME/.pnpm-store/v3/files"

      - name: 安装依赖
        working-directory: ./vela-src
        run: |
          pnpm store prune
          pnpm install --no-frozen-lockfile
          if ($LASTEXITCODE -ne 0) {
            pnpm install --force
          }

      - name: 构建 Windows 版本
        working-directory: ./vela-src
        run: pnpm build

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Windows-Exe-Node22
          path: vela-src/dist/*.exe
          retention-days: 30
