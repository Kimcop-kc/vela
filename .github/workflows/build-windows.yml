name: Build Windows Vela (备用方案)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout empty workspace
        uses: actions/checkout@v4

      - name: Clone original vela repo into subfolder
        run: git clone https://github.com/heider-x/vela.git vela-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        run: |
          npm install -g pnpm@8
          pnpm --version

      - name: 配置 npm 镜像源
        run: |
          npm config set registry https://registry.npmmirror.com
          npm config get registry

      - name: 清理可能存在的锁文件
        working-directory: ./vela-src
        run: |
          if (Test-Path "pnpm-lock.yaml") {
            Remove-Item -Path "pnpm-lock.yaml" -Force
          }
          if (Test-Path "node_modules") {
            Remove-Item -Path "node_modules" -Recurse -Force
          }

      - name: 安装依赖
        working-directory: ./vela-src
        run: |
          pnpm install --no-frozen-lockfile
          if ($LASTEXITCODE -ne 0) {
            pnpm store prune
            pnpm install --no-frozen-lockfile
          }

      - name: 构建项目
        working-directory: ./vela-src
        run: pnpm build

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Windows-Exe-Backup
          path: vela-src/dist/*.exe
          retention-days: 30
