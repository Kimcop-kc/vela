name: Build Windows Vela (npm版本)
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout empty workspace
        uses: actions/checkout@v4

      - name: Clone original vela repo into subfolder
        run: git clone https://github.com/heider-x/vela.git vela-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 配置 npm 镜像源
        run: npm config set registry https://registry.npmmirror.com

      - name: 清理可能存在的锁文件
        working-directory: ./vela-src
        run: |
          if (Test-Path "pnpm-lock.yaml") {
            Remove-Item -Path "pnpm-lock.yaml" -Force
          }
          if (Test-Path "node_modules") {
            Remove-Item -Path "node_modules" -Recurse -Force
          }

      - name: 使用 npm 安装依赖
        working-directory: ./vela-src
        run: |
          npm install --legacy-peer-deps
          if ($LASTEXITCODE -ne 0) {
            npm install --force --legacy-peer-deps
          }

      - name: 构建 Windows 版本
        working-directory: ./vela-src
        run: npm run build

      - name: 上传构建结果
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Windows-Exe-npm
          path: vela-src/dist/*.exe
          retention-days: 30
