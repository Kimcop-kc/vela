name: Build Windows Vela
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 删除 cache: 'pnpm' ！！！这就是本次报错根源

      - name: Install pnpm via npm
        run: npm install -g pnpm

      - name: Install Visual Studio Build Tools
        run: npm install -g windows-build-tools

      - name: Install dependencies
        run: pnpm install

      - name: Build Windows
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vela-Windows-Build
          path: dist/*.exe
